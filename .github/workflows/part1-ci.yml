name: Race Day Part 1 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-part1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f README.md
          test -f docs/RaceDay_ERD.pdf
          test -f docs/RaceDay_API_Endpoint_Plan.pdf
          test -f docs/RaceDay_Database.sql

      - name: Validate SQL file
        run: |
          test -s docs/RaceDay_Database.sql

      - name: Part 1 validation successful
        run: echo "Race Day Part 1 validation passed successfully."
