
name: Race Day Part 2 CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Find solution file
        shell: bash
        run: |
          SOLUTION=$(find . -maxdepth 4 -name '*.sln' -print -quit)
          if [ -z "$SOLUTION" ]; then
            echo "No solution file found."
            exit 1
          fi
          echo "SOLUTION=$SOLUTION" >> "$GITHUB_ENV"

      - name: Restore dependencies
        run: dotnet restore "$SOLUTION"

      - name: Build solution
        run: dotnet build "$SOLUTION" --configuration Release --no-restore

      - name: Run tests
        run: dotnet test "$SOLUTION" --configuration Release --no-build --verbosity normal
